name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Safety-net rebuild in case a push-triggered deploy fails silently --
    # this site is static (no portfolio-api calls), so a push is the only
    # thing that actually changes what gets deployed.
    - cron: '0 * * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
